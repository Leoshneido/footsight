[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footsight"
version = "0.1.0"
description = "Football analysis tool"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["footsight"]
